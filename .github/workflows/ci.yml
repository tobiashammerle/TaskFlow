name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linting
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format . --check

      - name: Run tests
        run: pytest

  docker-build:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest
    needs: test

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
        
        - name: Login to GitHub Containter Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build Docker image
          run: docker build -t ghcr.io/${GITHUB_REPOSITORY,,}:latest .

        - name: Push Docker image
          if: github.event_name == 'push' && github.ref == 'refs/heads/main'
          run: |
            docker push ghcr.io/${GITHUB_REPOSITORY,,}:latest
  
  deploy:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Helm
        shell: powershell
        run: helm version --short
      
      - name: Verify Kubernetes connection
        shell: powershell
        run: kubectl get nodes

      - name: Deploy TaskFlow to Kubernetes
        shell: powershell
        run: helm upgrade --install taskflow ./taskflow-chart --namespace default --set image.repository=ghcr.io/tobiashammerle/taskflow --set image.tag=latest --set image.pullPolicy=Always --wait --timeout 5m
        
