services:
  taskflow:
    image: taskflow:1.0
    container_name: taskflow-app
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - taskflow-data:/app/data
    environment:
      DATABASE_URL: "sqlite+aiosqlite:////app/data/task.db"
      SYNC_DATABASE_URL: "sqlite:////app/data/task.db"

volumes:
  taskflow-data:
    external: true